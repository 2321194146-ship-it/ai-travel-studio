<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>型男制造机 · 首页设计稿</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #08090a;
        --panel: #141516;
        --panel-2: #1a1a19;
        --line: rgba(255,255,255,.09);
        --gold: #ddb96f;
        --gold-2: #f0d49c;
        --text: #f5f1e8;
        --muted: #a39d92;
      }
      html, body { width: 100%; height: 100%; margin: 0; background: #000; }
      body {
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .phone {
        width: 390px;
        height: 844px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(circle at 92% 3%, rgba(221,185,111,.09), transparent 22%),
          linear-gradient(180deg, #0b0c0d 0%, #08090a 100%);
      }
      .status {
        height: 28px;
        padding: 5px 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
      }
      .status-icons { display: flex; align-items: center; gap: 5px; }
      .status-icons svg { display: block; }
      .content { padding: 8px 16px 92px; }
      .topline { display: flex; align-items: center; justify-content: space-between; }
      .brand {
        margin: 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: 25px;
        line-height: 1;
        letter-spacing: .5px;
        color: var(--gold-2);
        text-shadow: 0 0 22px rgba(221,185,111,.12);
      }
      .top-actions { display: flex; align-items: center; gap: 13px; }
      .bell { width: 22px; height: 22px; position: relative; }
      .bell::after {
        content: "";
        position: absolute;
        top: 0;
        right: 1px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ea5b45;
        box-shadow: 0 0 0 2px #0b0c0d;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(221,185,111,.55);
        object-fit: cover;
        object-position: 50% 23%;
      }
      .subtitle { margin: 13px 0 16px; color: #b9ae9b; font-size: 13px; letter-spacing: .1px; }
      .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .feature {
        height: 226px;
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        border: 1px solid rgba(255,255,255,.11);
        background: var(--panel);
        box-shadow: 0 12px 30px rgba(0,0,0,.24);
      }
      .feature img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; display: block; }
      .feature:nth-child(2) img { object-position: 56% 20%; }
      .feature::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5,5,5,.16) 5%, rgba(7,7,7,.18) 35%, rgba(7,7,7,.95) 100%);
      }
      .feature-copy { position: absolute; z-index: 2; inset: 14px 13px 12px; display: flex; flex-direction: column; }
      .feature h2 { margin: 0; font-size: 20px; line-height: 1.15; font-family: "Songti SC", "STSong", serif; font-weight: 600; }
      .feature p { margin: 7px 0 0; font-size: 11px; color: rgba(255,255,255,.68); line-height: 1.55; }
      .feature-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
      .feature-tag { color: var(--gold-2); font-size: 10px; letter-spacing: .3px; }
      .arrow {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #1b150a;
        background: linear-gradient(145deg, #f0d49c, #c99e52);
        box-shadow: 0 5px 18px rgba(212,169,91,.24);
        font-size: 19px;
      }
      .section-head { margin: 20px 1px 10px; display: flex; justify-content: space-between; align-items: center; }
      .section-head h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
      .section-head span { color: #99948b; font-size: 11px; }
      .recent { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
      .recent-card { border-radius: 10px; overflow: hidden; background: #121314; border: 1px solid rgba(255,255,255,.06); }
      .recent-card img { display: block; width: 100%; height: 86px; object-fit: cover; object-position: center 22%; }
      .recent-info { padding: 7px 7px 8px; }
      .recent-title { font-size: 10px; color: #e3ded4; white-space: nowrap; }
      .recent-date { margin-top: 4px; font-size: 9px; color: #77746f; }
      .task {
        margin-top: 16px;
        min-height: 88px;
        padding: 13px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 14px;
        border: 1px solid rgba(221,185,111,.28);
        background: linear-gradient(110deg, rgba(221,185,111,.14), rgba(25,25,23,.78) 52%, rgba(221,185,111,.08));
      }
      .task-icon {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--gold-2);
        border: 1px solid rgba(221,185,111,.45);
        background: rgba(221,185,111,.08);
      }
      .task-copy { min-width: 0; flex: 1; }
      .task-copy b { display: block; font-size: 13px; font-weight: 600; }
      .task-copy small { display: block; margin-top: 5px; color: #98938a; font-size: 10px; }
      .task button {
        border: 0;
        border-radius: 9px;
        padding: 9px 11px;
        color: #241a09;
        background: linear-gradient(145deg, #efd49d, #c99b4c);
        font-size: 11px;
        font-weight: 700;
      }
      .nav {
        position: absolute;
        z-index: 5;
        left: 0;
        right: 0;
        bottom: 0;
        height: 78px;
        padding: 9px 18px 13px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: rgba(10,11,12,.97);
        border-top: 1px solid rgba(255,255,255,.08);
        backdrop-filter: blur(18px);
      }
      .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #757673; font-size: 10px; }
      .nav-item svg { width: 22px; height: 22px; }
      .nav-item.active { color: var(--gold); }
      .home-indicator { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); width: 108px; height: 3px; background: #f4f4f4; border-radius: 99px; opacity: .9; }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="status">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 9h2V7H1v2Zm3 0h2V5H4v4Zm3 0h2V3H7v6Zm3 0h2V1h-2v8Z" fill="white"/></svg>
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 3.5C4.3.6 8.7.6 12 3.5M3 5.7c2-1.7 5-1.7 7 0M5.2 7.7c.8-.7 1.8-.7 2.6 0" stroke="white" stroke-width="1.2" stroke-linecap="round"/><circle cx="6.5" cy="9" r=".8" fill="white"/></svg>
          <svg width="20" height="10" viewBox="0 0 20 10" fill="none"><rect x=".5" y=".5" width="16" height="9" rx="2" stroke="white"/><rect x="2" y="2" width="12" height="6" rx="1" fill="white"/><path d="M18 3.5v3" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
      </div>

      <section class="content">
        <div class="topline">
          <h1 class="brand">型男制造机</h1>
          <div class="top-actions">
            <div class="bell">
              <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="#e7e2d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <img class="avatar" src="/mf-assets/book-man.png" alt="个人头像" />
          </div>
        </div>
        <p class="subtitle">AI 助你变帅，打造你的最佳展示面</p>

        <div class="feature-grid">
          <article class="feature">
            <img src="/mf-assets/book-man.png" alt="变帅改造" />
            <div class="feature-copy">
              <h2>变帅改造</h2>
              <p>AI 诊断脸型与气质<br />定制你的变帅方案</p>
              <div class="feature-bottom"><span class="feature-tag">发型 · 穿搭 · 气质</span><span class="arrow">›</span></div>
            </div>
          </article>
          <article class="feature">
            <img src="/mf-assets/cafe-man.png" alt="生活展示面" />
            <div class="feature-copy">
              <h2>生活展示面</h2>
              <p>打造自然高级的照片<br />展示更好的自己</p>
              <div class="feature-bottom"><span class="feature-tag">场景 · 氛围 · 出片</span><span class="arrow">›</span></div>
            </div>
          </article>
        </div>

        <div class="section-head"><h3>最近改造结果</h3><span>全部&nbsp; ›</span></div>
        <div class="recent">
          <article class="recent-card"><img src="/mf-assets/studio-before-after.png" alt="改造报告" /><div class="recent-info"><div class="recent-title">改造报告</div><div class="recent-date">05-20</div></div></article>
          <article class="recent-card"><img src="/mf-assets/book-man.png" alt="试穿效果" /><div class="recent-info"><div class="recent-title">试穿效果</div><div class="recent-date">05-18</div></div></article>
          <article class="recent-card"><img src="/mf-assets/cafe-man.png" alt="发型试穿" /><div class="recent-info"><div class="recent-title">发型试穿</div><div class="recent-date">05-16</div></div></article>
          <article class="recent-card"><img src="/mf-assets/market-man.png" alt="穿搭方案" /><div class="recent-info"><div class="recent-title">穿搭方案</div><div class="recent-date">05-15</div></div></article>
        </div>

        <div class="task">
          <div class="task-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3 14.2 9.8 21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2L12 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </div>
          <div class="task-copy"><b>完成今日变帅任务</b><small>上传 3 张照片，获取你的专属诊断</small></div>
          <button type="button">开始诊断</button>
        </div>
      </section>

      <nav class="nav">
        <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>首页</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="m4 20 7-7m3-3 4-4m-6-3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Zm7 9 .8 2.2L22 15l-2.2.8L19 18l-.8-2.2L16 15l2.2-.8L19 12Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>创作</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6m-5 3h4m4-10a6 6 0 1 0-12 0c0 2.2 1.2 3.6 2.4 4.8.7.7 1.1 1.3 1.1 2.2h5c0-.9.4-1.5 1.1-2.2C16.8 14.6 18 13.2 18 11Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>灵感</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>我的</span></div>
        <div class="home-indicator"></div>
      </nav>
    </main>
  </body>
</html>
